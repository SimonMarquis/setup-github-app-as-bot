name: 🤖 Setup GitHub App as bot
description: Generate a GitHub App access token and set up bot git identity for CI workflows.

branding:
  icon: terminal
  color: black

inputs:
  client-id:
    description: GitHub App Client ID
    required: true
  private-key:
    description: GitHub App private key
    required: true
  gh-auth-login:
    description: When 'true', run `gh auth login` with the app token.
    required: false
    default: true
  set-git-user:
    description: When 'true', configure the global git user as the bot.
    required: false
    default: true

outputs:
  app-slug:
    description: GitHub App slug
    value: ${{ steps.app-token.outputs.app-slug }}
  token:
    description: GitHub App installation access token
    value: ${{ steps.app-token.outputs.token }}
  user-id:
    description: GitHub App user id
    value: ${{ steps.get-app-user-id.outputs.user-id }}
  git-user-name:
    description: Git user name
    value: ${{ format('{0}[bot]', steps.app-token.outputs.app-slug) }}
  git-user-email:
    description: Git user email
    value: ${{ format('{0}+{1}[bot]@users.noreply.github.com', steps.get-app-user-id.outputs.user-id, steps.app-token.outputs.app-slug) }}
  git-identity:
    description: Git identity (e.g. `my-bot <12345+my-bot[bot]@users.noreply.github.com>`)
    value: ${{ format('{0}[bot] <{1}+{0}[bot]@users.noreply.github.com>', steps.app-token.outputs.app-slug, steps.get-app-user-id.outputs.user-id) }}

runs:
  using: composite
  steps:
    - uses: actions/create-github-app-token@v3
      id: app-token
      with:
        client-id: ${{ inputs.client-id }}
        private-key: ${{ inputs.private-key }}
    - id: get-app-user-id
      run: echo "user-id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
      shell: bash
      env:
        APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
    - if: inputs.gh-auth-login == 'true'
      run: |
        gh auth login --with-token <<< "$TOKEN"
        gh auth status
        gh auth setup-git
      shell: bash
      env:
        TOKEN: ${{ steps.app-token.outputs.token }}
    - if: inputs.set-git-user == 'true'
      run: |
        git config --global user.name "${APP_SLUG}[bot]"
        git config --global user.email "${APP_USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com"
      shell: bash
      env:
        APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        APP_USER_ID: ${{ steps.get-app-user-id.outputs.user-id }}
