name: 🤖 Setup GitHub App as bot
description: Generate a GitHub App access token and set up bot git identity for CI workflows.

branding:
  icon: terminal
  color: black

inputs:
  client-id:
    description: GitHub App Client ID
    required: true
  private-key:
    description: GitHub App private key
    required: true
  gh-auth-login:
    description: When 'true', authenticate GitHub CLI with the app token.
    required: false
    default: true
  gh-auth-setup-git:
    description: When 'true', configure Git to use GitHub CLI as its credential helper for authenticated GitHub hosts.
    required: false
    default: true
  set-git-user:
    description: When 'true', configure the global git user as the bot.
    required: false
    default: true
  permission-actions:
    description: Permission level for GitHub Actions workflows, runs, and artifacts. Can be set to 'read' or 'write'.
    required: false
  permission-artifact-metadata:
    description: Permission level to create and retrieve build artifact metadata records. Can be set to 'read' or 'write'.
    required: false
  permission-attestations:
    description: Permission level to create and retrieve repository attestations. Can be set to 'read' or 'write'.
    required: false
  permission-checks:
    description: Permission level for checks on code. Can be set to 'read' or 'write'.
    required: false
  permission-contents:
    description: Permission level for repository contents, commits, branches, downloads, releases, and merges. Can be set to 'read' or 'write'.
    required: false
  permission-deployments:
    description: Permission level for deployments and deployment statuses. Can be set to 'read' or 'write'.
    required: false
  permission-environments:
    description: Permission level for managing repository environments. Can be set to 'read' or 'write'.
    required: false
  permission-issues:
    description: Permission level for issues and related comments, assignees, labels, and milestones. Can be set to 'read' or 'write'.
    required: false
  permission-merge-queues:
    description: Permission level to manage the merge queues for a repository. Can be set to 'read' or 'write'.
    required: false
  permission-metadata:
    description: Permission level to search repositories, list collaborators, and access repository metadata. Can be set to 'read' or 'write'.
    required: false
  permission-organization-packages:
    description: Permission level for organization packages published to GitHub Packages. Can be set to 'read' or 'write'.
    required: false
  permission-organization-secrets:
    description: Permission level to manage organization secrets. Can be set to 'read' or 'write'.
    required: false
  permission-packages:
    description: Permission level for packages published to GitHub Packages. Can be set to 'read' or 'write'.
    required: false
  permission-pages:
    description: Permission level to retrieve Pages statuses, configuration, and builds, and create new builds. Can be set to 'read' or 'write'.
    required: false
  permission-pull-requests:
    description: Permission level for pull requests and related comments, assignees, labels, milestones, and merges. Can be set to 'read' or 'write'.
    required: false
  permission-repository-projects:
    description: Permission level to manage repository projects, columns, and cards. Can be set to 'read', 'write', or 'admin'.
    required: false
  permission-secrets:
    description: Permission level to manage repository secrets. Can be set to 'read' or 'write'.
    required: false
  permission-security-events:
    description: Permission level to view and manage security events like code scanning alerts. Can be set to 'read' or 'write'.
    required: false
  permission-statuses:
    description: Permission level for commit statuses. Can be set to 'read' or 'write'.
    required: false
  permission-vulnerability-alerts:
    description: Permission level to manage Dependabot alerts. Can be set to 'read' or 'write'.
    required: false

outputs:
  app-slug:
    description: GitHub App slug
    value: ${{ steps.app-token.outputs.app-slug }}
  token:
    description: GitHub App installation access token
    value: ${{ steps.app-token.outputs.token }}
  user-id:
    description: GitHub App user id
    value: ${{ steps.get-app-user-id.outputs.user-id }}
  git-user-name:
    description: Git user name
    value: ${{ format('{0}[bot]', steps.app-token.outputs.app-slug) }}
  git-user-email:
    description: Git user email
    value: ${{ format('{0}+{1}[bot]@users.noreply.github.com', steps.get-app-user-id.outputs.user-id, steps.app-token.outputs.app-slug) }}
  git-identity:
    description: Git identity (e.g. `my-bot <12345+my-bot[bot]@users.noreply.github.com>`)
    value: ${{ format('{0}[bot] <{1}+{0}[bot]@users.noreply.github.com>', steps.app-token.outputs.app-slug, steps.get-app-user-id.outputs.user-id) }}

runs:
  using: composite
  steps:
    - name: Validate inputs
      if: inputs.gh-auth-setup-git == 'true' && inputs.gh-auth-login != 'true'
      run: |
        echo "::error::'gh-auth-setup-git' requires 'gh-auth-login' to be enabled."
        exit 1
      shell: bash
    - uses: actions/create-github-app-token@v3
      id: app-token
      with:
        client-id: ${{ inputs.client-id }}
        private-key: ${{ inputs.private-key }}
        permission-actions: ${{ inputs.permission-actions }}
        permission-artifact-metadata: ${{ inputs.permission-artifact-metadata }}
        permission-attestations: ${{ inputs.permission-attestations }}
        permission-checks: ${{ inputs.permission-checks }}
        permission-contents: ${{ inputs.permission-contents }}
        permission-deployments: ${{ inputs.permission-deployments }}
        permission-environments: ${{ inputs.permission-environments }}
        permission-issues: ${{ inputs.permission-issues }}
        permission-merge-queues: ${{ inputs.permission-merge-queues }}
        permission-metadata: ${{ inputs.permission-metadata }}
        permission-organization-packages: ${{ inputs.permission-organization-packages }}
        permission-organization-secrets: ${{ inputs.permission-organization-secrets }}
        permission-packages: ${{ inputs.permission-packages }}
        permission-pages: ${{ inputs.permission-pages }}
        permission-pull-requests: ${{ inputs.permission-pull-requests }}
        permission-repository-projects: ${{ inputs.permission-repository-projects }}
        permission-secrets: ${{ inputs.permission-secrets }}
        permission-security-events: ${{ inputs.permission-security-events }}
        permission-statuses: ${{ inputs.permission-statuses }}
        permission-vulnerability-alerts: ${{ inputs.permission-vulnerability-alerts }}
    - id: get-app-user-id
      run: echo "user-id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
      shell: bash
      env:
        APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
    - if: inputs.gh-auth-login == 'true'
      name: Authenticate GitHub CLI
      run: |
        gh auth login --with-token <<< "$TOKEN"
        gh auth status
      shell: bash
      env:
        TOKEN: ${{ steps.app-token.outputs.token }}
    - if: inputs.gh-auth-setup-git == 'true'
      name: Configure Git authentication
      run: gh auth setup-git
      shell: bash
    - if: inputs.set-git-user == 'true'
      name: Configure Git identity
      run: |
        git config --global user.name "${APP_SLUG}[bot]"
        git config --global user.email "${APP_USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com"
      shell: bash
      env:
        APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        APP_USER_ID: ${{ steps.get-app-user-id.outputs.user-id }}
